<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Web Applications</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7eEEBYjDtcYj+AjBH3FLv5uSJuXg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" integrity="sha512-dPXYcDub/aeb08c63jRq/k6GaKccl256JQy/AnOq7CAnEZ9FzSL9wSbcZkMp4R26vBsMLFYH4kQ67/bbV8XaCQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            background-color: #f8f9fa;
            color: #212529;
            min-height: 100vh;
        }
        .github-link {
            position: fixed;
            top: 1rem;
            right: 1rem;
            font-size: 1.75rem;
            color: #212529;
            text-decoration: none;
        }
        .github-link:hover {
            color: #000;
        }
        .home {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100dvh;
            padding: max(18vh, 5rem) 1rem 2rem;
        }
        .home-title {
            font-size: 1.75rem;
            font-weight: 400;
            margin-bottom: 2rem;
            text-align: center;
        }
        .search-wrap {
            position: relative;
            width: 100%;
            max-width: 584px;
        }
        .search-field {
            position: relative;
        }
        #search {
            width: 100%;
            padding: 0.85rem 1.25rem;
            font-size: 1.1rem;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            outline: none;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.08);
            transition: box-shadow 0.2s;
        }
        #search:focus {
            border-color: transparent;
            box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15), 0 0 0 1px rgba(32, 33, 36, 0.08);
        }
        #search:disabled {
            background: #f1f3f4;
        }
        #hint {
            margin-top: 1.5rem;
            min-height: 2.8em;
            color: #70757a;
            font-size: 0.9rem;
            line-height: 1.4;
            text-align: center;
        }
        #results {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            right: 0;
            z-index: 10;
            max-height: min(50dvh, 20rem);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(32, 33, 36, 0.12);
        }
        #results:empty {
            display: none;
        }
        .result-item {
            display: block;
            width: 100%;
            padding: 0.75rem 1.25rem;
            border: none;
            border-bottom: 1px solid #f1f3f4;
            background: #fff;
            text-align: left;
            font-size: 1rem;
            color: #202124;
            cursor: pointer;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item:hover,
        .result-item.active {
            background: #f1f3f4;
        }
        #recent-apps {
            margin-top: 1.5rem;
            width: 100%;
        }
        .recent-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35rem;
            margin-bottom: 0.75rem;
        }
        .recent-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #70757a;
            margin: 0;
        }
        .recent-clear {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #70757a;
            padding: 0.15rem;
            font-size: 0.95rem;
            line-height: 1;
            cursor: pointer;
            border-radius: 50%;
            transition: color 0.15s, background-color 0.15s;
        }
        .recent-clear:hover {
            color: #202124;
            background: #e8eaed;
        }
        .recent-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
            gap: 0.75rem;
        }
        .recent-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 0.35rem;
            min-height: 5rem;
            padding: 0.9rem 1rem;
            border: 1px solid #e8eaed;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(60, 64, 67, 0.08);
            text-align: left;
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.3;
            color: #202124;
            cursor: pointer;
            transition: box-shadow 0.15s, border-color 0.15s, background-color 0.15s, transform 0.15s;
        }
        .recent-item-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.75rem;
            height: 1.75rem;
            border-radius: 8px;
            background: #e8f0fe;
            color: #1a73e8;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .recent-item-title {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .recent-item:hover,
        .recent-item.active {
            border-color: #d2e3fc;
            box-shadow: 0 2px 8px rgba(26, 115, 232, 0.12);
            background: #f8fbff;
            transform: translateY(-1px);
        }
        .recent-item.active {
            outline: 2px solid #1a73e8;
            outline-offset: -2px;
        }
        .recent-item:focus-visible {
            outline: 2px solid #1a73e8;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <a href="https://github.com/sanjaysingh/staticsites" class="github-link" target="_blank" rel="noopener" title="View on GitHub" aria-label="View on GitHub">
        <i class="bi bi-github"></i>
    </a>

    <main class="home">
        <h1 class="home-title">Utility Web Applications</h1>
        <div class="search-wrap">
            <div class="search-field">
                <input
                    type="search"
                    id="search"
                    disabled
                    placeholder="Loading…"
                    autocomplete="off"
                    spellcheck="false"
                    aria-label="Search apps"
                    aria-autocomplete="list"
                    aria-controls="results"
                />
                <div id="results" role="listbox"></div>
            </div>
            <div id="recent-apps" hidden>
                <div class="recent-header">
                    <p class="recent-label">Recent</p>
                    <button type="button" id="recent-clear" class="recent-clear" title="Clear recent apps" aria-label="Clear recent apps">
                        <i class="bi bi-x-circle" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="recent-list" role="listbox" aria-label="Recent apps"></div>
            </div>
            <p id="hint">Examples: case, jwt, pdf, hash, uuid</p>
        </div>
    </main>

    <script src="apps.js?v=__BUILD_ID__"></script>
    <script src="home.js?v=__BUILD_ID__"></script>
</body>
</html>
